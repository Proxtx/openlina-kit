[workspace]
resolver = "2"
members = ["tools/*", "mods/*"]
exclude = ["tools/steam-launch.sh"]

[workspace.package]
edition = "2021"
version = "0.1.3"

[workspace.dependencies]
openlina-sdk = { path = "tools/sdk" }
openlina = { path = "tools/openlina" }
hlbc = "0.7"
hlbc-decompiler = "0.7"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
