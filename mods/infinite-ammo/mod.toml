[mod]
id = "infinite-ammo"
name = "Infinite Ammo"
version = "0.1.0"
kit = "0.1.3"
section = "general"
description = "Items never run out: every shot leaves the slot's ammo as it was, for every item (also the ones from mods). Works with Ammo Boost."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.trace]
type = "bool"
default = false
description = "Print every shot whose ammo it kept (`[infinite-ammo] swap: ammo stays 3 (the game's change: -1)`; +1 for the game's refunds)."

[stats]
ammo = "∞"
applies_to = "all items"
