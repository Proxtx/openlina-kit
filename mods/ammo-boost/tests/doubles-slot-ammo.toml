# The harness loads a level; rollItemsRaw hands out 4 items (random per run: the harness seed
# does not seed the item roll). With the default factor 2, every slot must hold exactly twice
# its item's vanilla baseAmmo. The trace report reads the slots' real ammo in game.
# (The harness `items` option is not used: it writes the slot ammo itself, bypassing the game code.)
name = "ammo-boost: items start with twice their ammo (default factor)"
mods = ["ammo-boost"]
fixtures = ["trace-calls"]
timeout = 60

[options.ammo-boost]
trace = true

[options.trace-calls]
functions = ["fish.game.evsheet.EvSheet_manager_ev.rollItemsRaw"]
first = 5
every = 0

[harness]
level = "greendemo 1"
end_tick = 240

[[expect]]
contains = "[harness] level tick 1: greendemo 1"

# vanilla handed out the items...
[[expect]]
contains = "[trace-calls] fish.game.evsheet.EvSheet_manager_ev.rollItemsRaw call #1"

# ...the patch boosted each one...
[[expect]]
contains = " -> "
min = 4

# ...and the slots really hold 2x baseAmmo (title screen roll + test level: 4 slots each)
[[expect]]
contains = " x 2"
min = 8

[[expect]]
not_contains = "(not a multiple)"

