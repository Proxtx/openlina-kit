[mod]
id = "ammo-boost"
name = "Ammo Boost"
version = "0.1.0"
kit = "0.1.0"
section = "general"
description = "Every item you get starts with more ammo: the normal ammo times `factor` (2 by default). Works for item slots and item blocks in levels."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.factor]
type = "int"
default = 2
description = "Multiply the starting ammo of every item by this (0 to 1000). Items without ammo stay empty."

[options.trace]
type = "bool"
default = false
description = "Print every boosted value (`[ammo-boost] <item>: ammo 2 -> 4`) and, on tick 1 of every gameplay layout, the slots' real ammo compared with `baseAmmo` (`level start slot 0: frog ammo 6 = 2 x 3`)."

[stats]
ammo = "×2"
applies_to = "all items"
