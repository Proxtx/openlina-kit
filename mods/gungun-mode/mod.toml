[mod]
id = "gungun-mode"
name = "Gun Gun Mode"
version = "0.1.0"
kit = "0.1.3"
section = "general"
description = "You are the Gun Gun. In every level Lina is gone and the game's Gun Gun sits where she would have spawned; every roll holds a Gun Gun and it never runs out of ammo. Aim and shoot to kick it around, knock the fruits off the screen and fly it into the open portal."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]
after = ["infinite-ammo"]
showcase = ["gungun-mode.gif"]

[options.infinite_ammo]
type = "bool"
default = true
description = "The Gun Gun never runs out of ammo (its shots don't count down)."

[options.fruits]
type = "bool"
default = false
description = "The Gun Gun also collects the fruits it touches, as Lina would. Off: fruits count when they are knocked off the screen (as in vanilla)."

[options.trace]
type = "bool"
default = false
description = "Print what the mod does (`[gungun-mode] ...`): the slot that becomes the Gun Gun, where it starts, fruits it touches, kept ammo."

[stats]
per_level = "Lina replaced by the Gun Gun"
behavior = "vanilla Gun Gun"
