[mod]
id = "screen-wrap"
name = "Screen Wrap"
version = "0.4.0"
kit = "0.1.0"
section = "modifiers"
description = "A new modifier: in levels that roll it, objects leaving the screen come back on the opposite side instead of being destroyed. Long levels and boss arenas wrap top and bottom only."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.always]
type = "bool"
default = false
description = "Apply in every level instead of as a rolled modifier."

[options.coins]
type = "bool"
default = false
description = "Also wrap fruits. Pushing fruits out is how levels are won, so this makes levels unwinnable."

[options.player]
type = "bool"
default = false
description = "Also wrap Lina: leaving the screen (falling into a pit, walking off a side) brings her back on the opposite side instead of losing the level. Her other deaths stay."

[options.secondary]
type = "bool"
default = true
description = "Also wrap secondary physics objects."

[options.max_overshoot]
type = "float"
default = 200.0
description = "Only wrap objects at most this far past the edge. Physics objects move at most 100 units per tick (the Box2D speed cap, observed in game), so keep this above 100. Parked objects sit about 1000 out."

[options.min_tick]
type = "int"
default = 5
description = "Don't wrap during the first ticks of a layout, when levels delete objects placed off-screen."

[options.trace]
type = "bool"
default = false
description = "Print `[screen-wrap] tick T kind K (x, y) -> (x', y')` for every wrap."

[stats]
kind = "modifier"
rolls = "like vanilla"
fruits = "exempt"
