[mod]
id = "screen-wrap"
name = "Screen Wrap"
version = "0.5.0"
kit = "0.1.2"
section = "modifiers"
description = "A new modifier: in levels that roll it, objects leaving the screen come back on the opposite side instead of being destroyed. Long levels and boss arenas wrap top and bottom only."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.always]
type = "bool"
default = false
description = "Apply in every level instead of as a rolled modifier."

[options.coins]
type = "bool"
default = true
description = "Also wrap fruits. A fruit pushed off the screen is still collected, as in vanilla, and then comes back on the other side (already collected). Glitched fruits stay vanilla (back to their spawn until every player touched them)."

[options.frogs]
type = "bool"
default = true
description = "Also wrap frogs. A live frog leaving still counts as landed (they show up in the frog level), every time it crosses. The frog you steer in frog mode is left to vanilla: losing it still loses the level."

[options.joined]
type = "bool"
default = true
description = "Wrap objects joined to others (step ladders, bamboo, tentacles, chains) as a whole: pieces past the edge stay until the group's centre crosses, then every piece moves together. Groups held by level geometry or by Lina are left to vanilla."

[options.player]
type = "bool"
default = false
description = "Also wrap Lina: leaving the screen (falling into a pit, walking off a side) brings her back on the opposite side instead of losing the level. Her other deaths stay."

[options.secondary]
type = "bool"
default = true
description = "Also wrap secondary physics objects."

[options.max_overshoot]
type = "float"
default = 200.0
description = "Only wrap objects at most this far past the edge. Physics objects move at most 100 units per tick (the Box2D speed cap, observed in game), so keep this above 100. Parked objects sit about 1000 out."

[options.min_tick]
type = "int"
default = 5
description = "Don't wrap during the first ticks of a layout, when levels delete objects placed off-screen."

[options.trace]
type = "bool"
default = false
description = "Print `[screen-wrap] tick T kind K (x, y) -> (x', y')` for every wrap, `group of N with <type>, centre (x, y) -> (x', y')` for joined objects and `<type> is held by something that can't move` when a group is left to vanilla."

[stats]
kind = "modifier"
rolls = "like vanilla"
fruits = "wrap (still count)"
joined = "wrap together"
