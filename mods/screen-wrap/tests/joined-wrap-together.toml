name = "screen-wrap: a step ladder (6 pieces held by joints) wraps as a whole once it is off the screen"
mods = ["screen-wrap"]
fixtures = ["debug-spawn"]
timeout = 60

[options.screen-wrap]
trace = true
always = true

# Lina builds a step ladder on her platform; at tick 300 it is thrown up, off the top
[options.debug-spawn]
spawns = ["box@5:-1000,-1000"]          # (the fixture's own box, parked out of the way)
pushes = ["stepladder@300:0,-900"]

[harness]
level = "greendemo 1"
seed = 1
items = ["stepladder"]
inputs = ["60:shoot"]
end_tick = 480

# all six pieces move together: out at the top, in at the bottom (dy: the screen's height and more)
[[expect]]
contains = "group of 6 with stepladder moved by (0, 3"
# ...and never one piece alone
[[expect]]
not_contains = " kind 0 ("
