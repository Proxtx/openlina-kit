name = "screen-wrap: with always = true it wraps in every level, no modifier needed"
mods = ["screen-wrap"]
fixtures = ["debug-spawn"]
timeout = 60

[options.screen-wrap]
trace = true
always = true

[options.debug-spawn]
object = "box"
tick = 30
x = 540.0
y = 60.0

[harness]
level = "greendemo 1"
modifier = 0
end_tick = 600

[[expect]]
contains = "[screen-wrap] tick"
min = 2
