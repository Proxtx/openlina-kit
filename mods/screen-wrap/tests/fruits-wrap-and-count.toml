name = "screen-wrap: a fruit pushed off the screen is collected and still wraps (once collected, it stays collected)"
mods = ["screen-wrap"]
fixtures = ["debug-spawn", "inspect"]
timeout = 60

[options.screen-wrap]
trace = true

# a second fruit, just below the bottom edge
[options.debug-spawn]
object = "coin"
tick = 30
x = 540.0
y = 400.0

[options.inspect]
at = ["tick:25", "tick:200"]
print = ["@coin[].state", "@coin[].personal_gravity", "@spr_coin[].sprite.anim"]

[harness]
level = "greendemo 1"
modifier_key = "screen-wrap"   # force the modifier
end_tick = 600

# collected as it crosses, like vanilla's delete would...
[[expect]]
contains = "[screen-wrap] tick 30 fruit collected"
# ...and wrapped to the top instead of disappearing
[[expect]]
contains = "[screen-wrap] tick 30 kind 1 (540, 400) -> (540, 106)"
# it is still there later, collected (the level's own fruit is not)
[[expect]]
contains = "[inspect] tick:200 @coin[1].state = 1"
[[expect]]
contains = "[inspect] tick:200 @coin[0].state = 0"
[[expect]]
contains = "fruit collected"
max = 1
# ...and looks and floats like a touched fruit (the darker model; vanilla tryTouchCoin)
[[expect]]
contains = "[inspect] tick:200 @spr_coin[1].sprite.anim = blue_collected"
[[expect]]
contains = "[inspect] tick:200 @coin[1].personal_gravity = 0.125"
[[expect]]
contains = "[inspect] tick:200 @spr_coin[0].sprite.anim = green"
