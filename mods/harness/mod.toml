[mod]
id = "harness"
name = "Test Harness"
version = "0.4.0"
kit = "0.1.0"
section = "dev"
description = "Drives the game for tests and recordings without input: skips the title, loads a chosen level with chosen items and modifier, plays scripted inputs, captures frames, exits at a given tick."
authors = ["openlina-kit"]
requires = ["core"]

[options.start_tick]
type = "int"
default = 5
description = "title-screen tick at which to skip to the game (like a key press)"

[options.level]
type = "string"
default = ""
description = "Level to load, by name (see list_levels). Empty: keep the run's first level (the tutorial)."

[options.level_n]
type = "int"
default = -1
description = "Level number within `level`'s pack (-1: any)."

[options.seed]
type = "int"
default = 1
description = "Seed for the level roll and every RNG of the run (items, modifiers, colors, ...), so runs are reproducible."

[options.modifier]
type = "int"
default = -1
description = "Force this modifier id (-1: rolled)."

[options.roll_modifier]
type = "bool"
default = false
description = "Let the game draw a random modifier for the level (seeded), as it does in runs."

[options.modifier_key]
type = "string"
default = ""
description = "Force the modifier registered with this key (e.g. \"screen-wrap\"); overrides `modifier`."

[options.items]
type = "list"
default = []
description = "Items to roll from (up to 3, repeated if fewer; names from list_levels). The game assigns them with its own code (ammo included, so ammo mods apply); slot order follows the seed. Items marked secondLayer only appear in second-layer runs."

[options.inputs]
type = "list"
default = []
description = "Scripted inputs in level ticks: \"60-90:right+jump\" or \"120:shoot\". Actions: up down left right jump shoot switch restart. While set, the keyboard is ignored."

[options.end_tick]
type = "int"
default = 0
description = "Exit the game (code 0) at this level tick. 0: never."

[options.capture]
type = "string"
default = ""
description = "Capture frames \"from-to/step\" in level ticks, e.g. \"60-300/2\"."

[options.capture_dir]
type = "string"
default = "frames"
description = "Directory for captured frames (absolute, or relative to the overlay game dir)."

[options.pause_tick]
type = "int"
default = 0
description = "Open the pause menu at this level tick (0: never)."

[options.dump_menu]
type = "bool"
default = false
description = "With pause_tick: print every pause menu item (including hidden submenu items)."

[options.menu_open]
type = "string"
default = ""
description = "With pause_tick: two ticks later, select the pause menu item with exactly this text and press it (e.g. to open a submenu)."

[options.capture_ui]
type = "bool"
default = false
description = "Also draw the UI layer (pause menu, ...) into captured frames."

[options.list_levels]
type = "bool"
default = false
description = "Print all levels in the pool and all items in the item pool, then exit."

[options.new_run]
type = "bool"
default = false
description = "a returning player's run from the hub (tutorial done, RNGs seeded): the game's own run start with the MANAGER tool selection follows (`inputs` like `\"30-700:right\"` walk off the hub's right edge, `jump` confirms). The selection runs no gameplay ticks, so `capture`/`end_tick` also count layout ticks there"

[options.new_run_items]
type = "list"
default = []
description = "With new_run: put these items (by name) into the first slots of the run start's tool roll."

[options.turbo]
type = "int"
default = 16
description = "Extra game steps per rendered frame (0 = real time). Steps keep their fixed length, so results don't change, only the wall-clock time."

[options.heartbeat]
type = "int"
default = 1200
description = "Print `[harness] layout <name> tick <t>` when the main layout changes and every this many of its ticks (0 = off), so a hang's log shows where it stopped."

[options.chaos]
type = "bool"
default = false
description = "From tick 60 of every layout but the title, when no scripted input is active: random inputs (seeded, new every 15 ticks; never restart). Random play in levels, wandering into new runs in the hub. For soak tests."

[options.end_total]
type = "int"
default = 0
description = "Exit after this many game steps in total, on any screen (0 = off). For soak runs through deaths and new runs."

[options.roll_until_modifier]
type = "string"
default = ""
description = "Roll with the game's own code (up to 500 seeds) until it draws this modifier (key or id); prints `[harness] modifier <id> drawn by the game's roll after N roll(s)`. Tests a modifier is in the pool without a fixed seed."

[options.slots]
type = "list"
default = []
description = "Exactly these tools in the slots at level tick 1: `[\"box\", \"swap:2\"]` (name, optional ammo). Replays of recordings use it; `items` rolls instead."
