[mod]
id = "debug-spawn"
name = "Debug Spawn"
version = "0.2.0"
kit = "0.1.2"
section = "dev"
description = "Test fixture: spawn objects at fixed ticks of every gameplay layout."
authors = ["openlina-kit"]
requires = ["core"]

[options.object]
type = "string"
default = "box"
description = "Object type to create (see fish.game.oclass.OClass_*)."

[options.tick]
type = "int"
default = 60
description = "Layout tick at which to spawn."

[options.x]
type = "float"
default = 300.0
description = "x position (the play field is 600 x 338)."

[options.y]
type = "float"
default = 60.0
description = "y position."

[options.layer]
type = "int"
default = 0
description = "Layer index."

[options.spawns]
type = "list"
default = []
description = "Several objects instead: [\"<type>@<tick>:<x>,<y>\", ...] (layer 0). Overrides object/tick/x/y/layer."

[options.pushes]
type = "list"
default = []
description = "Velocities to give: [\"<type>@<tick>:<vx>,<vy>\", ...]: at that tick every physics object of the type gets that velocity (`Physics.setVelocity`), e.g. to throw a built step ladder off the screen."
