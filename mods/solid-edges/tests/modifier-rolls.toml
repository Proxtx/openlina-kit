name = "solid-edges: the game's own modifier roll can draw it, and the HUD shows its icon"
mods = ["solid-edges"]
fixtures = ["inspect"]
timeout = 30

# the HUD modifier icon (an OClass_optionthingos) plays the mod's animation
[options.inspect]
at = ["tick:30"]
print = ["@optionthingos[].sprite.anim"]

[harness]
level = "greendemo 1"
roll_until_modifier = "solid-edges"   # the game's own roll, until it draws it (no seed to keep in sync)
end_tick = 40

[[expect]]
contains = "[harness] modifier 7003 drawn by the game's roll after"
[[expect]]
contains = "[harness] level tick 1: greendemo 1 modifier 7003"
[[expect]]
contains = ".sprite.anim = openlina_mod_7003"
