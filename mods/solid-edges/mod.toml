[mod]
id = "solid-edges"
name = "Solid Edges"
version = "0.2.0"
section = "modifiers"
description = "A new modifier: in levels that roll it, the screen border is a wall and objects bounce off it instead of flying off and despawning. Long levels and boss arenas keep their left and right sides open. Combines with screen-wrap (one modifier per level)."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.always]
type = "bool"
default = false
description = "Apply in every level instead of as a rolled modifier (then it steps aside in levels that roll screen-wrap)."

[options.bounce]
type = "float"
default = 0.5
description = "Share of the speed kept when bouncing off the border (0 = stop dead, 1 = perfectly elastic)."

[options.friction]
type = "float"
default = 0.9
description = "Speed along the border kept per tick of contact (1 = frictionless sliding)."

[options.rest_speed]
type = "float"
default = 40.0
description = "Impacts slower than this stop instead of bouncing (avoids jitter while resting on the border)."

[options.coins]
type = "bool"
default = false
description = "Fruits bounce too. Pushing fruits out is how levels are won, so this makes levels unwinnable."

[options.trace]
type = "bool"
default = false
description = "Print every real bounce (not resting contact) to stdout."

[stats]
kind = "modifier"
rolls = "like vanilla"
bounce = "50%"
fruits = "exempt"
