name = "swap: by default Swap trades places with level geometry too (the platform tile under Lina)"
mods = ["swap"]
fixtures = ["debug-spawn"]
timeout = 60

[options.swap]
trace = true

# the same scene as walls-block.toml: a box below the platform, which the ray never reaches
[options.debug-spawn]
object = "box"
tick = 118
x = 130.0
y = 280.0

[harness]
level = "greendemo 1"
seed = 3
items = ["swap", "box"]
inputs = ["90-122:down", "120:shoot"]   # aim down, at the platform
end_tick = 140

# the ray stops at the platform tile, which trades places with Lina
[[expect]]
contains = "[swap] tick 121: player ("
[[expect]]
contains = ") <-> tile_short ("
[[expect]]
not_contains = "blocked by"
# both stay where the swap put them: the static tile moved, Lina is in its old spot
[[expect]]
contains = "near the object's old spot: true"
[[expect]]
contains = "near where it was sent: true"
