name = "swap: firing plays the teleporter shot, the swap the teleport (sounds)"
mods = ["swap"]
fixtures = ["debug-spawn", "trace-calls"]
timeout = 60

[options.swap]
trace = true

# the scene of swap-box.toml: a box right of Lina
[options.debug-spawn]
object = "box"
tick = 10
x = 170.0
y = 185.0

[options.trace-calls]
functions = ["fish.game.evsheet.EvSheet.sfx"]
first = 50
every = 0

[harness]
level = "greendemo 1"
seed = 3
items = ["swap", "box"]
inputs = ["60:shoot"]
end_tick = 100

[[expect]]
contains = ") <-> box ("
[[expect]]
contains = "shoot_telebox"
[[expect]]
contains = "tele_telebox"
