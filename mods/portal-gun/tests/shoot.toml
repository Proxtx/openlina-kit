name = "portal-gun: firing places a blue, then an orange portal along the aim"
mods = ["portal-gun"]
timeout = 60

[options.portal-gun]
trace = true

[harness]
level = "greendemo 1"
seed = 3
items = ["portal", "box"]
inputs = ["40:shoot", "50-110:right", "120:shoot"]   # walk right between the shots
end_tick = 180

[[expect]]
contains = "[portal-gun] placed blue at"
[[expect]]
contains = "[portal-gun] placed orange at"
