[mod]
id = "mod-menu"
name = "Mod Menu"
version = "0.2.0"
kit = "0.1.3"
section = "general"
description = "Adds an OPENLINA MODS entry to the pause menu that lists the installed mods and their versions; each mod opens a page with its option values. Long lists get pages, so everything stays on screen."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.show_options]
type = "bool"
default = true
description = "Each mod opens a page with its option values. Off: just the list of mods."

[options.trace]
type = "bool"
default = false
description = "Print the entries it adds to stdout."

[stats]
where = "pause menu"
shows = "mods + options"
