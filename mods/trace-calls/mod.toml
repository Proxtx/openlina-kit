[mod]
id = "trace-calls"
name = "Trace Calls"
version = "0.2.0"
kit = "0.1.0"
section = "dev"
description = "Debug tool: print a line when chosen functions are called."
authors = ["openlina-kit"]
after = ["core"]

[options.functions]
type = "list"
default = []
description = "Functions to trace: `pkg.Class.method`, `Class.method`, a findex, an injected function (`swap/use`), or `hook:<name>` for a core hook."

[options.first]
type = "int"
default = 3
description = "Print the first N calls of each function."

[options.every]
type = "int"
default = 600
description = "Then print every N-th call (0 = never)."

[options.args]
type = "bool"
default = true
description = "Also print each call's arguments (numbers, strings, objects as their class)."
