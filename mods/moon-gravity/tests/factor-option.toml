name = "moon-gravity: factor = 0.25 makes the box fall slower still"
mods = ["moon-gravity"]
fixtures = ["debug-spawn", "trace-positions"]
timeout = 60

[options.moon-gravity]
trace = true
factor = 0.25

[options.debug-spawn]
object = "box"
tick = 30
x = 540.0
y = 60.0

[options.trace-positions]
types = ["box"]
ticks = "200"

[harness]
level = "greendemo 1"
modifier_key = "moon-gravity"
seed = 1
end_tick = 220

[[expect]]
contains = "[moon-gravity] greendemo 1 tick 1: gravity x0.25"

# 16 units fallen: half of the default factor's 32 (92.3), a quarter of vanilla's 65 (124.7)
[[expect]]
position = { tick = 200, type = "box", x = 540, y = 76.2, within = 2 }
[[expect]]
position = { tick = 200, type = "box", x = 540, y = 92.3, within = 8, away = true }
