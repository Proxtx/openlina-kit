[mod]
id = "ray-crosshair"
name = "Ray Crosshair"
version = "0.1.0"
kit = "0.1.1"
section = "general"
description = "A utility for item mods: while Lina holds an item that asks for it, a marker shows where her aim meets the next surface (the first tile, wall or object along the aim, within the item's range). Swap and the Portal Gun use it."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.trace]
type = "bool"
default = false
description = "Print what the aim hits every `trace_every` ticks (`[ray-crosshair] tick T: aim hits <type> at (x, y)`, or `marker hidden`) and the marker as `[pos] tick T ray-crosshair x y` (for `position` expectations)."

[options.trace_every]
type = "int"
default = 30
description = "With trace: print every this many level ticks."

[stats]
kind = "utility"
used_by = "swap, portal-gun"
shows = "the next surface along the aim"
