[mod]
id = "ray-crosshair"
name = "Ray Crosshair"
version = "0.3.0"
kit = "0.1.3"
section = "general"
description = "A utility for item mods: while Lina holds an item that asks for it, the game's own reticle reaches as far as the item does. It sits on the first tile, wall or object along the aim within the item's range, or at the end of the range. Swap and the Portal Gun use it."
authors = ["openlina-kit"]
game_builds = ["22056877"]
requires = ["core"]

[options.trace]
type = "bool"
default = false
description = "Print where the reticle goes every `trace_every` ticks (`[ray-crosshair] tick T: reticle on <type> at (x, y)` or `reticle at the end of the range (x, y)`) and the reticle as `[pos] tick T ray-crosshair x y` (for `position` expectations)."

[options.trace_every]
type = "int"
default = 30
description = "With trace: print every this many level ticks."

[stats]
kind = "utility"
used_by = "swap, portal-gun"
shows = "the next surface along the aim, with the game's reticle"
