name = "ray-crosshair: showcase: the game's reticle shows what Swap will hit"
mods = ["swap"]
fixtures = ["debug-spawn"]
timeout = 60

[options.ray-crosshair]
trace = true
trace_every = 10

[options.swap]
trace = true

[options.debug-spawn]
object = "box"
tick = 10
x = 170.0
y = 185.0

[harness]
level = "greendemo 1"
seed = 3
items = ["swap", "box"]
# down: the floor; forward: the box; shoot: Lina and the box trade places; up: the sky (the reticle at the edge of the screen)
inputs = ["20-55:down", "100:shoot", "130-160:up"]
end_tick = 180

[[expect]]
contains = ": reticle on tile_short at ("
[[expect]]
contains = ": reticle on box at ("
[[expect]]
contains = ") <-> box ("
[[expect]]
contains = "reticle at the end of the range"

[gif]
capture = "15-180/2"
out = "media/reticle.gif"
