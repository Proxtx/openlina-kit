name = "ray-crosshair: the marker replaces the game's reticle, which comes back for other items"
mods = ["swap"]                      # requires ray-crosshair
timeout = 60

[options.ray-crosshair]
trace = true
trace_every = 10

[harness]
level = "greendemo 1"
seed = 1
items = ["swap", "box"]
inputs = ["50:switch"]               # to the box, which doesn't ask for the marker
end_tick = 80

# Swap is selected from the start: the reticle goes when the marker first shows...
[[expect]]
contains = ": game reticle hidden"
# (it comes back whenever the marker hides: the aim briefly meets nothing while Lina lands)
# switching to the box hides the marker and gives the reticle back
[[expect]]
contains = ": game reticle shown"
[[expect]]
contains = ": marker hidden"
