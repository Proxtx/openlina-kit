name = "ray-crosshair: only items that asked get the long reticle; it comes back when switching back"
mods = ["swap"]
timeout = 60

[options.ray-crosshair]
trace = true
trace_every = 20

[harness]
level = "greendemo 1"
seed = 1
items = ["swap", "box"]
# switch to the box (slot 2), then on to slot 3 (swap again; the 3rd slot holds the first item)
inputs = ["45-48:switch", "85-88:switch"]
end_tick = 140

[[expect]]
contains = "[ray-crosshair] tick 40: reticle on fern at ("
# the box didn't ask: vanilla places the reticle, the mod prints nothing
[[expect]]
not_contains = "[ray-crosshair] tick 60:"
[[expect]]
not_contains = "[ray-crosshair] tick 80:"
[[expect]]
contains = "[ray-crosshair] tick 120: reticle on fern at ("
