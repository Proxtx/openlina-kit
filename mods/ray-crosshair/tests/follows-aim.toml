name = "ray-crosshair: the reticle follows the aim: the floor when aiming down, the screen's edge for the sky"
mods = ["portal-gun"]
timeout = 60

[options.ray-crosshair]
trace = true
trace_every = 20

[harness]
level = "greendemo 1"
seed = 1
items = ["portal", "box"]
inputs = ["30-65:down", "70-110:up"]
end_tick = 120

[[expect]]
contains = "[ray-crosshair] tick 20: reticle on fern at ("      # forward: the vine
[[expect]]
contains = ": reticle on tile_short at ("                  # down: the tile under Lina
# the reticle on the tile, at Lina's feet (she stands at about y 194, the tile's top at 201)
[[expect]]
position = { tick = 60, type = "ray-crosshair", y_gt = 195, y_lt = 206, x_gt = 110, x_lt = 135 }
# up: nothing within range; the reticle stops below the HUD bar, so it stays visible
[[expect]]
contains = "[ray-crosshair] tick 100: reticle at the end of the range ("
[[expect]]
position = { tick = 100, type = "ray-crosshair", y_gt = 31, y_lt = 33 }
